<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Coffeemon</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --coffee-dark: #3b2415;
      --coffee: #6f4e37;
      --coffee-light: #a47551;
      --cream: #efe7da;
      --paper: #ffffff;
      --ink: #20180f;
      --muted: #6f6155;
      --line: #ddd0bf;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Topo do site (não vai pro PDF) ── */
    header.site {
      background: linear-gradient(135deg, var(--coffee-dark), var(--coffee));
      color: #fff;
      padding: 22px 20px;
      text-align: center;
    }
    header.site a { color: #fff; text-decoration: none; }
    header.site .brand { font-size: 1.4rem; font-weight: 700; letter-spacing: .5px; }
    header.site .tag { opacity: .85; font-size: .85rem; margin-top: 2px; }

    main { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; }

    /* ── Barra de ações (nav + baixar) — não vai pro PDF ── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      justify-content: space-between; margin-bottom: 20px;
    }
    .toolbar nav a {
      color: var(--coffee); text-decoration: none; font-size: .92rem;
      margin-right: 16px; border-bottom: 1px solid transparent;
    }
    .toolbar nav a:hover { border-bottom-color: var(--coffee); }
    .pdf-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--coffee-dark); color: #fff; border: none;
      padding: 10px 18px; border-radius: 8px; font-size: .92rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 6px rgba(59,36,21,.25);
      transition: background .15s, transform .05s;
    }
    .pdf-btn:hover { background: var(--coffee); }
    .pdf-btn:active { transform: translateY(1px); }

    /* ── A "folha" do documento ── */
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: clamp(28px, 6vw, 64px);
      box-shadow: 0 10px 40px rgba(59, 36, 21, .10);
      font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
      font-size: 1.02rem;
      line-height: 1.7;
      text-align: justify;
      hyphens: auto;
    }

    /* ── Cabeçalho formal do documento (timbre) ── */
    .letterhead {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-bottom: 14px; margin-bottom: 8px;
      border-bottom: 2px solid var(--coffee-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .letterhead .lh-brand { font-size: 1.15rem; font-weight: 700; color: var(--coffee-dark); }
    .letterhead .lh-type {
      font-size: .72rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--coffee-dark); font-size: clamp(1.5rem, 4vw, 2rem);
      margin: .6em 0 .1em; text-align: left;
    }
    h2 {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--coffee-dark); margin-top: 1.9em; font-size: 1.3rem;
      border-bottom: 1px solid var(--line); padding-bottom: .25em;
    }
    h3 { color: var(--coffee-dark); margin-top: 1.5em; font-size: 1.08rem; }
    p, li { text-align: justify; }
    a { color: var(--coffee); }
    a:hover { color: var(--coffee-dark); }
    strong { color: var(--ink); }
    code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      background: var(--cream); padding: .1em .35em; border-radius: 4px; font-size: .88em;
    }
    blockquote {
      margin: 1.3em 0; padding: .7em 1.1em;
      background: #f7f1e7; border-left: 3px solid var(--coffee-light);
      color: var(--muted); font-size: .95em;
    }
    table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: .92rem; }
    th, td { border: 1px solid var(--line); padding: .5em .7em; text-align: left; vertical-align: top; }
    th { background: var(--cream); color: var(--coffee-dark); }
    hr { border: none; border-top: 1px solid var(--line); margin: 1.8em 0; }

    footer.site { text-align: center; color: var(--muted); font-size: .8rem; padding: 20px; }
    footer.site a { color: var(--muted); }

    /* ════════ MODO IMPRESSÃO / PDF ════════ */
    @page { margin: 2cm 2cm 2.2cm; }
    @media print {
      header.site, .toolbar, footer.site { display: none !important; }
      body { background: #fff; color: #000; }
      main { padding: 0; max-width: none; }
      article {
        border: none; border-radius: 0; box-shadow: none; padding: 0;
        font-size: 11pt; line-height: 1.55; color: #000;
      }
      .letterhead { border-bottom: 2px solid #000; }
      .letterhead .lh-brand, h1, h2, h3 { color: #000; }
      h2 { border-bottom: 1px solid #999; }
      a { color: #000; text-decoration: none; }
      /* não quebrar títulos/tabelas no meio da página */
      h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
      table, blockquote, li { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a href="{{ '/' | relative_url }}">
      <div class="brand">☕ Coffeemon</div>
      <div class="tag">Documentos legais</div>
    </a>
  </header>
  <main>
    <div class="toolbar">
      <nav>
        <a href="{{ '/termos/' | relative_url }}">Termos de Uso</a>
        <a href="{{ '/privacidade/' | relative_url }}">Política de Privacidade</a>
      </nav>
      <button class="pdf-btn" type="button" onclick="window.print()" aria-label="Baixar como PDF">
        📄 Baixar PDF
      </button>
    </div>
    <article>
      <div class="letterhead">
        <span class="lh-brand">☕ Coffeemon</span>
        <span class="lh-type">Documento oficial</span>
      </div>
      {{ content }}
    </article>
  </main>
  <footer class="site">
    Coffeemon · código sob <a href="https://github.com/Gigio42/Coffeemon/blob/main/LICENSE">GNU AGPL v3</a>
  </footer>
</body>
</html>
