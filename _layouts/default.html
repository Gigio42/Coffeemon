<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Coffeemon</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --coffee-dark: #3b2415;
      --coffee: #6f4e37;
      --coffee-light: #a47551;
      --cream: #f5efe6;
      --paper: #fffaf3;
      --ink: #2b2018;
      --muted: #7a6a5d;
      --line: #e7dccd;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header.site {
      background: linear-gradient(135deg, var(--coffee-dark), var(--coffee));
      color: var(--paper);
      padding: 28px 20px;
      text-align: center;
    }
    header.site a { color: var(--paper); text-decoration: none; }
    header.site .brand { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
    header.site .tag { opacity: .85; font-size: .9rem; margin-top: 4px; }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 36px clamp(20px, 5vw, 52px);
      box-shadow: 0 8px 30px rgba(59, 36, 21, .06);
    }
    h1 { color: var(--coffee-dark); font-size: clamp(1.6rem, 4vw, 2.1rem); margin: 0 0 .2em; }
    h2 { color: var(--coffee); margin-top: 2em; border-bottom: 2px solid var(--line); padding-bottom: .3em; }
    h3 { color: var(--coffee-dark); margin-top: 1.6em; }
    a { color: var(--coffee); }
    a:hover { color: var(--coffee-dark); }
    code { background: var(--cream); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
    blockquote {
      margin: 1.4em 0;
      padding: .8em 1.1em;
      background: #fff6e9;
      border-left: 4px solid var(--coffee-light);
      border-radius: 0 8px 8px 0;
      color: var(--muted);
    }
    table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: .95rem; }
    th, td { border: 1px solid var(--line); padding: .55em .7em; text-align: left; vertical-align: top; }
    th { background: var(--cream); color: var(--coffee-dark); }
    hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
    .doc-nav { margin-bottom: 22px; font-size: .92rem; }
    .doc-nav a { margin-right: 16px; }
    footer.site { text-align: center; color: var(--muted); font-size: .82rem; padding: 24px 20px 48px; }
    footer.site a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="site">
    <a href="{{ '/' | relative_url }}">
      <div class="brand">☕ Coffeemon</div>
      <div class="tag">Documentos legais</div>
    </a>
  </header>
  <main>
    <nav class="doc-nav">
      <a href="{{ '/termos/' | relative_url }}">Termos de Uso</a>
      <a href="{{ '/privacidade/' | relative_url }}">Política de Privacidade</a>
    </nav>
    <article>
      {{ content }}
    </article>
  </main>
  <footer class="site">
    Coffeemon · código sob <a href="https://github.com/Gigio42/Coffeemon/blob/main/LICENSE">GNU AGPL v3</a>
  </footer>
</body>
</html>
